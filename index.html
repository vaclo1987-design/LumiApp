<!doctype html>
<html lang="sk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Lumi - HTML5 vzdelávacia aplikácia pre Svet plný zábavy, pripravená ako ľahký VIKI balík."
    />
    <title>Lumi - Svet plný zábavy</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar" aria-label="Horná lišta aplikácie">
        <button class="brand-button" id="homeButton" type="button" aria-label="Prejsť na výber profilu">
          <img src="assets/lumi-icon.png" alt="" />
          <span>
            <strong>Lumi</strong>
            <small>Svet plný zábavy</small>
          </span>
        </button>

        <div class="status-strip" aria-live="polite">
          <span class="status-pill" id="profilePill">Profil</span>
          <span class="status-pill light-pill" id="lightPill" aria-label="Nazbierané svetielka">0</span>
        </div>

        <nav class="toolbar" aria-label="Rýchle ovládanie">
          <button class="icon-button" id="mapButton" type="button" aria-label="Mapa">
            <span aria-hidden="true">⌂</span>
          </button>
          <button class="icon-button" id="surpriseButton" type="button" aria-label="Lumikové prekvapenia">
            <span aria-hidden="true">★</span>
          </button>
          <button class="icon-button" id="alphabetButton" type="button" aria-label="Abeceda">
            <span aria-hidden="true">A</span>
          </button>
          <button class="icon-button" id="parentButton" type="button" aria-label="Rodičovská zóna">
            <span aria-hidden="true">⚿</span>
          </button>
        </nav>
      </header>

      <main id="app" tabindex="-1"></main>

      <section class="lumi-panel" aria-live="polite">
        <img id="lumiPose" src="assets/poses/lumi_hovori.png" alt="" />
        <div>
          <p id="lumiLine">Ahoj. Vyber si profil a môžeme začať.</p>
          <div class="voice-row">
            <button class="soft-button" id="repeatButton" type="button">Počúvaj znova</button>
            <label class="volume-label">
              <span>Hlas</span>
              <input id="volumeRange" type="range" min="0" max="1" step="0.1" value="0.8" />
            </label>
          </div>
        </div>
      </section>
    </div>

    <div class="modal-backdrop" id="alphabetModal" aria-hidden="true">
      <section class="modal-sheet alphabet-sheet" role="dialog" aria-modal="true" aria-labelledby="alphabetTitle">
        <div class="modal-head">
          <div>
            <p class="eyebrow">Nápoveda</p>
            <h2 id="alphabetTitle">Abeceda</h2>
          </div>
          <button class="icon-button" id="closeAlphabetButton" type="button" aria-label="Späť k úlohe">
            <span aria-hidden="true">×</span>
          </button>
        </div>
        <div class="alphabet-grid" id="alphabetGrid"></div>
      </section>
    </div>

    <div class="modal-backdrop" id="parentModal" aria-hidden="true">
      <section class="modal-sheet parent-sheet" role="dialog" aria-modal="true" aria-labelledby="parentTitle">
        <div class="modal-head">
          <div>
            <p class="eyebrow">Rodičovská zóna</p>
            <h2 id="parentTitle">Odomknutie Sveta plného zábavy</h2>
          </div>
          <button class="icon-button" id="closeParentButton" type="button" aria-label="Zavrieť">
            <span aria-hidden="true">×</span>
          </button>
        </div>
        <div id="parentContent"></div>
      </section>
    </div>

    <div class="modal-backdrop" id="profileModal" aria-hidden="true">
      <section class="modal-sheet profile-editor-sheet" role="dialog" aria-modal="true" aria-labelledby="profileEditorTitle">
        <div class="modal-head">
          <div>
            <p class="eyebrow">Profil dieťaťa</p>
            <h2 id="profileEditorTitle">Upraviť profil</h2>
          </div>
          <button class="icon-button" id="closeProfileButton" type="button" aria-label="Zavrieť">
            <span aria-hidden="true">×</span>
          </button>
        </div>
        <form class="profile-form" id="profileForm">
          <label class="field-label" for="profileNameInput">
            <span>Meno</span>
            <input id="profileNameInput" name="profileName" type="text" maxlength="24" autocomplete="off" required />
          </label>
          <fieldset class="avatar-picker">
            <legend>Obrázok profilu</legend>
            <div class="avatar-grid" id="profileAvatarGrid"></div>
          </fieldset>
          <div class="modal-actions">
            <button class="soft-button" id="cancelProfileButton" type="button">Zrušiť</button>
            <button class="primary-button" type="submit">Uložiť profil</button>
          </div>
        </form>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="app.js"></script>
  </body>
</html>
